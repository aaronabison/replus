<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
  <title>5x5 Green & Red Guessing Game</title>
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
  <style>
    * {
      box-sizing: border-box;
      user-select: none;
      -webkit-user-select: none;
      touch-action: manipulation;
    }

    body {
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: #0f172a;
      color: #f8fafc;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
    }

    #status-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      width: 340px;
      margin-bottom: 16px;
      padding: 8px 16px;
      background-color: #1e293b;
      border-radius: 20px;
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.3);
    }

    .heart-container {
      display: flex;
      gap: 6px;
      font-size: 22px;
    }

    .heart {
      transition: transform 0.2s ease, opacity 0.2s ease;
    }

    .heart.lost {
      opacity: 0.25;
      filter: grayscale(100%);
      transform: scale(0.85);
    }

    #score-display {
      font-size: 18px;
      font-weight: bold;
      color: #38bdf8;
      letter-spacing: 0.5px;
    }

    #board-wrapper {
      position: relative;
      width: 340px;
      height: 340px;
    }

    #snackbar {
      position: absolute;
      top: -45px;
      left: 50%;
      transform: translateX(-50%);
      background-color: #ef4444;
      color: #ffffff;
      padding: 8px 16px;
      border-radius: 8px;
      font-size: 13px;
      font-weight: bold;
      box-shadow: 0 4px 12px rgba(239, 68, 68, 0.4);
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.25s ease, transform 0.25s ease;
      z-index: 20;
      white-space: nowrap;
    }

    #snackbar.show {
      opacity: 1;
      transform: translate(-50%, 5px);
    }

    #grid {
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      grid-template-rows: repeat(5, 1fr);
      gap: 8px;
      width: 100%;
      height: 100%;
      background-color: #1e293b;
      padding: 10px;
      border-radius: 16px;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.5);
    }

    .cell {
      background-color: #334155;
      border-radius: 8px;
      cursor: pointer;
      transition: background-color 0.2s ease, transform 0.1s ease;
    }

    .cell:active {
      transform: scale(0.92);
    }

    .cell.safe {
      background-color: #22c55e !important;
      cursor: default;
    }

    .cell.mine {
      background-color: #ef4444 !important;
      cursor: default;
    }

    #completion-card {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background-color: #1e293b;
      border-radius: 16px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 20px;
      text-align: center;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.5);
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.6s ease;
      z-index: 10;
    }

    #completion-card.active {
      opacity: 1;
      pointer-events: auto;
    }

    #completion-card h2 {
      margin: 0 0 10px 0;
      font-size: 24px;
    }

    #completion-card p.result-text {
      font-size: 18px;
      color: #f8fafc;
      margin: 10px 0;
    }

    #completion-card span.highlight {
      color: #38bdf8;
      font-weight: bold;
      font-size: 26px;
    }

    .shake {
      animation: shake 0.4s cubic-bezier(0.36, 0.07, 0.19, 0.97) both;
    }

    @keyframes shake {
      10%, 90% { transform: translate3d(-2px, 0, 0); }
      20%, 80% { transform: translate3d(4px, 0, 0); }
      30%, 50%, 70% { transform: translate3d(-6px, 0, 0); }
      40%, 60% { transform: translate3d(6px, 0, 0); }
    }
  </style>
</head>
<body>

  <div id="status-bar">
    <div class="heart-container">
      <span id="heart-1" class="heart">❤️</span>
      <span id="heart-2" class="heart">❤️</span>
    </div>
    <div id="score-display">Score: 0</div>
  </div>

  <div id="board-wrapper">
    <div id="snackbar">💥 Mine hit! -1 Heart</div>

    <div id="grid"></div>

    <div id="completion-card">
      <h2 id="card-title">🎉 Puzzle Completed!</h2>
      <p class="result-text">Total Score: <br><span id="final-score" class="highlight">0</span> pts</p>
      <p style="color: #94a3b8; margin-top: 15px;">Come back tomorrow for a new board!</p>
    </div>
  </div>

  <script>
    const GRID_SIZE = 5;
    const TOTAL_CELLS = GRID_SIZE * GRID_SIZE; // 25 tiles
    const POINTS_PER_SAFE_TILE = 10;

    // =========================================================================
    // 🛠️ ADMIN CONFIGURATION (Indices 0 to 24)
    // =========================================================================
    // Place mine indices for today's puzzle here (e.g., 5 mines)
    const ADMIN_MINES = [2, 7, 13, 17, 22];
    // =========================================================================

    const TOTAL_SAFE_TILES = TOTAL_CELLS - ADMIN_MINES.length;

    let heartsLeft = 2;
    let score = 0;
    let revealedCount = 0;
    let isGameOver = false;
    let revealedMap = new Array(TOTAL_CELLS).fill(false);
    let audioCtx = null;

    const wrapper = document.getElementById('board-wrapper');
    const grid = document.getElementById('grid');
    const snackbar = document.getElementById('snackbar');
    const scoreDisplay = document.getElementById('score-display');
    const completionCard = document.getElementById('completion-card');
    const cardTitle = document.getElementById('card-title');
    const finalScoreDisplay = document.getElementById('final-score');

    function playSound(type) {
      try {
        if (!audioCtx) {
          audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        }
        if (audioCtx.state === 'suspended') {
          audioCtx.resume();
        }

        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();

        if (type === 'pop') {
          osc.type = 'sine';
          osc.frequency.setValueAtTime(523.25, audioCtx.currentTime);
          gain.gain.setValueAtTime(0.1, audioCtx.currentTime);
          gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.08);
          osc.connect(gain);
          gain.connect(audioCtx.destination);
          osc.start();
          osc.stop(audioCtx.currentTime + 0.08);
        } else if (type === 'boom') {
          osc.type = 'sawtooth';
          osc.frequency.setValueAtTime(120, audioCtx.currentTime);
          osc.frequency.exponentialRampToValueAtTime(30, audioCtx.currentTime + 0.3);
          gain.gain.setValueAtTime(0.3, audioCtx.currentTime);
          gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.3);
          osc.connect(gain);
          gain.connect(audioCtx.destination);
          osc.start();
          osc.stop(audioCtx.currentTime + 0.3);
        }
      } catch (e) {}

      if (navigator.vibrate) {
        navigator.vibrate(type === 'boom' ? [100, 50, 100] : 20);
      }
    }

    function triggerPlentyConfetti() {
      if (typeof confetti !== 'function') return;
      const duration = 2.5 * 1000;
      const animationEnd = Date.now() + duration;

      const interval = setInterval(function() {
        const timeLeft = animationEnd - Date.now();
        if (timeLeft <= 0) return clearInterval(interval);

        const particleCount = 40;
        confetti({ particleCount, angle: 60, spread: 70, origin: { x: 0, y: 0.6 } });
        confetti({ particleCount, angle: 120, spread: 70, origin: { x: 1, y: 0.6 } });
      }, 250);
    }

    function showSnackbar(msg) {
      snackbar.innerText = msg;
      snackbar.classList.add('show');
      setTimeout(() => snackbar.classList.remove('show'), 1200);
    }

    function createBoard() {
      grid.innerHTML = '';
      for (let i = 0; i < TOTAL_CELLS; i++) {
        const cell = document.createElement('div');
        cell.className = 'cell';
        cell.dataset.index = i;
        cell.addEventListener('click', () => handleCellClick(i));
        grid.appendChild(cell);
      }
    }

    function handleCellClick(idx) {
      if (isGameOver || revealedMap[idx]) return;

      revealedMap[idx] = true;
      const cell = grid.children[idx];

      // MINE (Red)
      if (ADMIN_MINES.includes(idx)) {
        cell.classList.add('mine');
        playSound('boom');
        heartsLeft--;

        if (heartsLeft === 1) {
          document.getElementById('heart-2').classList.add('lost');
          showSnackbar("💥 Mine hit! -1 Heart");
          wrapper.classList.add('shake');
          setTimeout(() => wrapper.classList.remove('shake'), 400);
        } else if (heartsLeft === 0) {
          document.getElementById('heart-1').classList.add('lost');
          endGame(false);
        }
        return;
      }

      // SAFE (Green)
      cell.classList.add('safe');
      playSound('pop');
      revealedCount++;
      
      score += POINTS_PER_SAFE_TILE;
      scoreDisplay.innerText = `Score: ${score}`;

      if (revealedCount === TOTAL_SAFE_TILES) {
        endGame(true);
      }
    }

    function endGame(isVictory) {
      isGameOver = true;

      if (isVictory) {
        cardTitle.innerText = "🎉 Board Fully Cleared!";
        cardTitle.style.color = "#38bdf8";
        triggerPlentyConfetti();
      } else {
        cardTitle.innerText = "💔 Out of Hearts!";
        cardTitle.style.color = "#ef4444";
      }

      finalScoreDisplay.innerText = score;

      if (window.ReactNativeWebView) {
        window.ReactNativeWebView.postMessage(JSON.stringify({
          type: "GAME_OVER",
          status: isVictory ? "VICTORY" : "OUT_OF_HEARTS",
          finalScore: score
        }));
      }

      setTimeout(() => {
        grid.style.visibility = 'hidden';
        completionCard.classList.add('active');
      }, 1200);
    }

    createBoard();
  </script>
</body>
</html>
