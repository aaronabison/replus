<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
  <title>Lights Out Daily</title>
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
  <style>
    * {
      box-sizing: border-box;
      user-select: none;
      -webkit-user-select: none;
      touch-action: manipulation;
    }

    body {
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: #0f172a;
      color: #f8fafc;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
    }

    #status-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      width: 340px;
      margin-bottom: 16px;
      padding: 8px 18px;
      background-color: #1e293b;
      border-radius: 20px;
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.3);
    }

    #move-display {
      font-size: 18px;
      font-weight: bold;
      color: #38bdf8;
      letter-spacing: 0.5px;
    }

    #lights-left-display {
      font-size: 18px;
      font-weight: bold;
      color: #f59e0b;
      letter-spacing: 0.5px;
    }

    #board-wrapper {
      position: relative;
      width: 340px;
      height: 340px;
    }

    #grid {
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      grid-template-rows: repeat(5, 1fr);
      gap: 8px;
      width: 100%;
      height: 100%;
      background-color: #1e293b;
      padding: 10px;
      border-radius: 16px;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.5);
    }

    .cell {
      background-color: #334155;
      border-radius: 8px;
      cursor: pointer;
      transition: background-color 0.25s ease, box-shadow 0.25s ease, transform 0.1s ease;
    }

    .cell:active {
      transform: scale(0.92);
    }

    /* Light ON State */
    .cell.is-on {
      background-color: #f59e0b !important;
      box-shadow: 0 0 12px #f59e0b, 0 0 24px rgba(245, 158, 11, 0.4);
    }

    #completion-card {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background-color: #1e293b;
      border-radius: 16px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 20px;
      text-align: center;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.5);
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.6s ease;
      z-index: 10;
    }

    #completion-card.active {
      opacity: 1;
      pointer-events: auto;
    }

    #completion-card h2 {
      margin: 0 0 10px 0;
      color: #38bdf8;
      font-size: 24px;
    }

    #completion-card p.result-text {
      font-size: 18px;
      color: #f8fafc;
      margin: 10px 0;
    }

    #completion-card span.highlight {
      color: #4ade80;
      font-weight: bold;
      font-size: 26px;
    }
  </style>
</head>
<body>

  <div id="status-bar">
    <div id="move-display">Moves: 0</div>
    <div id="lights-left-display">💡 On: 0</div>
  </div>

  <div id="board-wrapper">
    <div id="grid"></div>

    <div id="completion-card">
      <h2>🎉 Lights Out Cleared!</h2>
      <p class="result-text">Total Moves: <br><span id="final-moves" class="highlight">0</span></p>
      <p style="color: #94a3b8; margin-top: 15px;">Come back tomorrow for a new board!</p>
    </div>
  </div>

  <script>
    const GRID_SIZE = 6;
    const TOTAL_CELLS = GRID_SIZE * GRID_SIZE; // 25 tiles

    // =========================================================================
    // 🛠️ ADMIN CONFIGURATION (Indices 0 to 24 that start ON)
    // =========================================================================
    // Solvable starting puzzle pattern
    const ADMIN_INITIAL_ON = [0, 1, 3, 4, 6, 8, 12, 16, 18, 20, 21, 23, 24];
    // =========================================================================

    let boardState = new Array(TOTAL_CELLS).fill(false);
    let moveCount = 0;
    let isGameOver = false;
    let audioCtx = null;

    const grid = document.getElementById('grid');
    const moveDisplay = document.getElementById('move-display');
    const lightsLeftDisplay = document.getElementById('lights-left-display');
    const completionCard = document.getElementById('completion-card');
    const finalMovesDisplay = document.getElementById('final-moves');

    function playToggleSound() {
      try {
        if (!audioCtx) {
          audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        }
        if (audioCtx.state === 'suspended') {
          audioCtx.resume();
        }

        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();

        osc.type = 'sine';
        osc.frequency.setValueAtTime(440, audioCtx.currentTime); // A4
        gain.gain.setValueAtTime(0.1, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.06);

        osc.connect(gain);
        gain.connect(audioCtx.destination);

        osc.start();
        osc.stop(audioCtx.currentTime + 0.06);
      } catch (e) {}

      if (navigator.vibrate) {
        navigator.vibrate(25);
      }
    }

    function triggerPlentyConfetti() {
      if (typeof confetti !== 'function') return;
      const duration = 2.5 * 1000;
      const animationEnd = Date.now() + duration;

      const interval = setInterval(function() {
        const timeLeft = animationEnd - Date.now();
        if (timeLeft <= 0) return clearInterval(interval);

        const particleCount = 40;
        confetti({ particleCount, angle: 60, spread: 70, origin: { x: 0, y: 0.6 } });
        confetti({ particleCount, angle: 120, spread: 70, origin: { x: 1, y: 0.6 } });
      }, 250);
    }

    function getAdjacentIndices(idx) {
      const row = Math.floor(idx / GRID_SIZE);
      const col = idx % GRID_SIZE;
      const neighbors = [idx]; // Include self

      if (row > 0) neighbors.push((row - 1) * GRID_SIZE + col); // Up
      if (row < GRID_SIZE - 1) neighbors.push((row + 1) * GRID_SIZE + col); // Down
      if (col > 0) neighbors.push(row * GRID_SIZE + (col - 1)); // Left
      if (col < GRID_SIZE - 1) neighbors.push(row * GRID_SIZE + (col + 1)); // Right

      return neighbors;
    }

    function createBoard() {
      grid.innerHTML = '';
      ADMIN_INITIAL_ON.forEach(idx => {
        if (idx >= 0 && idx < TOTAL_CELLS) {
          boardState[idx] = true;
        }
      });

      for (let i = 0; i < TOTAL_CELLS; i++) {
        const cell = document.createElement('div');
        cell.className = 'cell';
        if (boardState[i]) cell.classList.add('is-on');
        cell.dataset.index = i;
        cell.addEventListener('click', () => handleCellClick(i));
        grid.appendChild(cell);
      }

      updateUI();
    }

    function handleCellClick(idx) {
      if (isGameOver) return;

      const toToggle = getAdjacentIndices(idx);
      toToggle.forEach(i => {
        boardState[i] = !boardState[i];
        const cell = grid.children[i];
        if (boardState[i]) {
          cell.classList.add('is-on');
        } else {
          cell.classList.remove('is-on');
        }
      });

      moveCount++;
      playToggleSound();
      updateUI();

      // Check win condition: All lights are OFF
      const remainingOn = boardState.filter(isOn => isOn).length;
      if (remainingOn === 0) {
        endGame();
      }
    }

    function updateUI() {
      const remainingOn = boardState.filter(isOn => isOn).length;
      moveDisplay.innerText = `Moves: ${moveCount}`;
      lightsLeftDisplay.innerText = `💡 On: ${remainingOn}`;
    }

    function endGame() {
      isGameOver = true;
      triggerPlentyConfetti();

      if (window.ReactNativeWebView) {
        window.ReactNativeWebView.postMessage(JSON.stringify({
          type: "GAME_OVER",
          status: "VICTORY",
          totalMoves: moveCount
        }));
      }

      setTimeout(() => {
        finalMovesDisplay.innerText = moveCount;
        grid.style.visibility = 'hidden';
        completionCard.classList.add('active');
      }, 800);
    }

    createBoard();
  </script>
</body>
</html>
