<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
  <title>Color Flood Daily</title>
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
  <style>
    * {
      box-sizing: border-box;
      user-select: none;
      -webkit-user-select: none;
      touch-action: manipulation;
    }

    body {
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: #0f172a;
      color: #f8fafc;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
    }

    #status-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      width: 340px;
      margin-bottom: 16px;
      padding: 8px 18px;
      background-color: #1e293b;
      border-radius: 20px;
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.3);
    }

    #move-display {
      font-size: 18px;
      font-weight: bold;
      color: #38bdf8;
      letter-spacing: 0.5px;
    }

    #progress-display {
      font-size: 18px;
      font-weight: bold;
      color: #4ade80;
      letter-spacing: 0.5px;
    }

    #board-wrapper {
      position: relative;
      width: 340px;
      height: 340px;
    }

    #grid {
      display: grid;
      grid-template-columns: repeat(6, 1fr);
      grid-template-rows: repeat(6, 1fr);
      gap: 6px;
      width: 100%;
      height: 100%;
      background-color: #1e293b;
      padding: 10px;
      border-radius: 16px;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.5);
    }

    .cell {
      border-radius: 6px;
      transition: background-color 0.25s ease;
    }

    /* Color Palette Controls */
    #color-palette {
      display: flex;
      justify-content: space-between;
      width: 340px;
      margin-top: 20px;
      padding: 10px 14px;
      background-color: #1e293b;
      border-radius: 20px;
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.3);
    }

    .color-btn {
      width: 42px;
      height: 42px;
      border-radius: 50%;
      border: 3px solid transparent;
      cursor: pointer;
      transition: transform 0.1s ease, border-color 0.2s ease;
    }

    .color-btn:active {
      transform: scale(0.85);
    }

    .color-btn.active {
      border-color: #ffffff;
      transform: scale(1.1);
    }

    #completion-card {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background-color: #1e293b;
      border-radius: 16px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 20px;
      text-align: center;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.5);
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.6s ease;
      z-index: 10;
    }

    #completion-card.active {
      opacity: 1;
      pointer-events: auto;
    }

    #completion-card h2 {
      margin: 0 0 10px 0;
      font-size: 24px;
    }

    #completion-card p.result-text {
      font-size: 18px;
      color: #f8fafc;
      margin: 10px 0;
    }

    #completion-card span.highlight {
      color: #38bdf8;
      font-weight: bold;
      font-size: 26px;
    }
  </style>
</head>
<body>

  <div id="status-bar">
    <div id="move-display">Moves: 0 / 12</div>
    <div id="progress-display">100%</div>
  </div>

  <div id="board-wrapper">
    <div id="grid"></div>

    <div id="completion-card">
      <h2 id="card-title">🎉 Board Flooded!</h2>
      <p class="result-text">Total Moves Used: <br><span id="final-moves" class="highlight">0</span></p>
      <p style="color: #94a3b8; margin-top: 15px;">Come back tomorrow for a new puzzle!</p>
    </div>
  </div>

  <div id="color-palette"></div>

  <script>
    const GRID_SIZE = 6;
    const TOTAL_CELLS = GRID_SIZE * GRID_SIZE; // 36 tiles

    // Available 6 Vibrant Colors
    const COLORS = [
      '#ef4444', // 0: Red
      '#3b82f6', // 1: Blue
      '#22c55e', // 2: Green
      '#eab308', // 3: Yellow
      '#a855f7', // 4: Purple
      '#f97316'  // 5: Orange
    ];

    // =========================================================================
    // 🛠️ ADMIN CONFIGURATION
    // =========================================================================
    const MAX_MOVES = 12;

    // Daily 6x6 Board Setup (Color IDs 0 through 5)
    const ADMIN_BOARD_MATRIX = [
      0, 1, 2, 3, 4, 5,
      1, 0, 3, 2, 5, 4,
      2, 3, 0, 1, 4, 5,
      3, 2, 1, 0, 5, 4,
      4, 5, 4, 5, 0, 1,
      5, 4, 5, 4, 1, 0
    ];
    // =========================================================================

    let currentBoard = [...ADMIN_BOARD_MATRIX];
    let moveCount = 0;
    let isGameOver = false;
    let audioCtx = null;

    const grid = document.getElementById('grid');
    const palette = document.getElementById('color-palette');
    const moveDisplay = document.getElementById('move-display');
    const progressDisplay = document.getElementById('progress-display');
    const completionCard = document.getElementById('completion-card');
    const cardTitle = document.getElementById('card-title');
    const finalMovesDisplay = document.getElementById('final-moves');

    function playPopSound() {
      try {
        if (!audioCtx) {
          audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        }
        if (audioCtx.state === 'suspended') {
          audioCtx.resume();
        }

        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();

        osc.type = 'sine';
        osc.frequency.setValueAtTime(523.25, audioCtx.currentTime); // C5
        gain.gain.setValueAtTime(0.1, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.08);

        osc.connect(gain);
        gain.connect(audioCtx.destination);

        osc.start();
        osc.stop(audioCtx.currentTime + 0.08);
      } catch (e) {}

      if (navigator.vibrate) {
        navigator.vibrate(20);
      }
    }

    function triggerPlentyConfetti() {
      if (typeof confetti !== 'function') return;
      const duration = 2.5 * 1000;
      const animationEnd = Date.now() + duration;

      const interval = setInterval(function() {
        const timeLeft = animationEnd - Date.now();
        if (timeLeft <= 0) return clearInterval(interval);

        const particleCount = 40;
        confetti({ particleCount, angle: 60, spread: 70, origin: { x: 0, y: 0.6 } });
        confetti({ particleCount, angle: 120, spread: 70, origin: { x: 1, y: 0.6 } });
      }, 250);
    }

    function getAdjacentIndices(idx) {
      const row = Math.floor(idx / GRID_SIZE);
      const col = idx % GRID_SIZE;
      const neighbors = [];

      if (row > 0) neighbors.push((row - 1) * GRID_SIZE + col); // Up
      if (row < GRID_SIZE - 1) neighbors.push((row + 1) * GRID_SIZE + col); // Down
      if (col > 0) neighbors.push(row * GRID_SIZE + (col - 1)); // Left
      if (col < GRID_SIZE - 1) neighbors.push(row * GRID_SIZE + (col + 1)); // Right

      return neighbors;
    }

    function createBoard() {
      grid.innerHTML = '';
      for (let i = 0; i < TOTAL_CELLS; i++) {
        const cell = document.createElement('div');
        cell.className = 'cell';
        cell.style.backgroundColor = COLORS[currentBoard[i]];
        grid.appendChild(cell);
      }

      // Create Palette Buttons
      palette.innerHTML = '';
      COLORS.forEach((color, colorIdx) => {
        const btn = document.createElement('button');
        btn.className = 'color-btn';
        btn.style.backgroundColor = color;
        btn.addEventListener('click', () => handleColorSelect(colorIdx));
        palette.appendChild(btn);
      });

      updateUI();
    }

    function handleColorSelect(targetColorIdx) {
      const currentColorIdx = currentBoard[0];

      // Ignore if game over or picking the same current flood color
      if (isGameOver || targetColorIdx === currentColorIdx) return;

      // Flood Fill Algorithm starting from top-left (0)
      const floodedSet = new Set();
      const queue = [0];

      while (queue.length > 0) {
        const curr = queue.pop();
        if (floodedSet.has(curr)) continue;

        floodedSet.add(curr);

        const neighbors = getAdjacentIndices(curr);
        neighbors.forEach(nIdx => {
          if (!floodedSet.has(nIdx) && currentBoard[nIdx] === currentColorIdx) {
            queue.push(nIdx);
          }
        });
      }

      // Apply new color to all flooded cells
      floodedSet.forEach(idx => {
        currentBoard[idx] = targetColorIdx;
        grid.children[idx].style.backgroundColor = COLORS[targetColorIdx];
      });

      moveCount++;
      playPopSound();
      updateUI();

      // Check Win Condition
      const firstColor = currentBoard[0];
      const isUnified = currentBoard.every(colorIdx => colorIdx === firstColor);

      if (isUnified) {
        endGame(true);
      } else if (moveCount >= MAX_MOVES) {
        endGame(false);
      }
    }

    function updateUI() {
      moveDisplay.innerText = `Moves: ${moveCount} / ${MAX_MOVES}`;
      
      const firstColor = currentBoard[0];
      const matchingCount = currentBoard.filter(c => c === firstColor).length;
      const progressPct = Math.round((matchingCount / TOTAL_CELLS) * 100);
      progressDisplay.innerText = `${progressPct}%`;

      // Highlight active color in palette
      const buttons = palette.children;
      for (let i = 0; i < buttons.length; i++) {
        if (i === currentBoard[0]) {
          buttons[i].classList.add('active');
        } else {
          buttons[i].classList.remove('active');
        }
      }
    }

    function endGame(isVictory) {
      isGameOver = true;

      if (isVictory) {
        cardTitle.innerText = "🎉 Board Flooded!";
        cardTitle.style.color = "#38bdf8";
        triggerPlentyConfetti();
      } else {
        cardTitle.innerText = "💔 Out of Moves!";
        cardTitle.style.color = "#ef4444";
      }

      finalMovesDisplay.innerText = `${moveCount} / ${MAX_MOVES}`;

      if (window.ReactNativeWebView) {
        window.ReactNativeWebView.postMessage(JSON.stringify({
          type: "GAME_OVER",
          status: isVictory ? "VICTORY" : "OUT_OF_MOVES",
          totalMoves: moveCount
        }));
      }

      setTimeout(() => {
        grid.style.visibility = 'hidden';
        palette.style.visibility = 'hidden';
        completionCard.classList.add('active');
      }, 800);
    }

    createBoard();
  </script>
</body>
</html>
